<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="red-circle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Outer glow & Red circle base -->
  <circle cx="32" cy="32" r="30" fill="url(#red-circle)" />
  <!-- Glass inner highlight rim -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#specular)" stroke-width="1.5" />
  
  <!-- K (Left) -->
  <text 
    x="18" 
    y="40" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="22" 
    font-weight="900" 
    fill="#ffffff"
    letter-spacing="-1"
  >K</text>
  
  <!-- Tiny Play Button (Between K and S) -->
  <polygon points="30,26 30,38 38,32" fill="#ffffff" />
  
  <!-- S (Right) -->
  <text 
    x="48" 
    y="40" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="22" 
    font-weight="900" 
    fill="#ffffff"
    letter-spacing="-1"
  >S</text>
</svg>
